[project]
name = "notelinks"
version = "0.1.0"
description = "Suggests idea-resonance links between an org-mode note and the rest of a notes corpus"
authors = [
    { name = "Bibek Panthi", email = "bpanthi977@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "typer>=0.26.4",
]

[project.scripts]
notelinks = "notelinks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
